[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-one-inference"
version = "0.1.0"
description = "Single-forward-pass choice inference for open causal language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8,<3",
    "transformers>=4.56,<5",
    "typesafe-sdk>=0.6,<0.7",
]

[tool.setuptools.packages.find]
include = ["system_one*"]

[tool.setuptools.package-data]
system_one = ["py.typed"]
